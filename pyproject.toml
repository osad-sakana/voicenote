[project]
name = "voicenote"
version = "0.1.0"
description = "Local voice recording and transcription tool with Markdown note output"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "scipy",
    "numpy",
    "rich",
    "openai>=1.0.0",
    "httpx",
    "python-dotenv",
    "customtkinter",
    "tkinterdnd2>=0.6.2",
]

[project.optional-dependencies]
live-mlx = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
voicenote = "main:main"
voicenote-cli = "main_cli:main"

[tool.setuptools]
py-modules = [
    "main",
    "main_cli",
    "config",
    "recorder",
    "wav_writer",
    "transcriber",
    "note_writer",
    "formatter",
    "logging_setup",
    "pipeline",
    "live_cli",
]
packages = ["gui", "live"]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "mlx: Apple Silicon の MLX 実機が必要なテスト（デフォルトでは skip）",
    "ollama: 実機 Ollama サーバーが必要なテスト（VOICENOTE_RUN_OLLAMA=1 のときのみ実行）",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "logs", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
